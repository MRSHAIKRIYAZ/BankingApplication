<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="ISO-8859-1">
  <title>Login | LARA Bank</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #e1f5fe, #b3e5fc);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .login-container {
      background-color: white;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
      width: 420px;
      animation: fadeIn 0.8s ease-in-out;
    }

    h2 {
      color: #d32f2f;
      text-align: center;
      margin-bottom: 10px;
    }

    h3 {
      text-align: center;
      color: #0277bd;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-top: 12px;
      font-weight: bold;
      color: #333;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
    }

    input[type="submit"] {
      background-color: #0288d1;
      color: white;
      padding: 12px 20px;
      border: none;
      border-radius: 6px;
      width: 100%;
      margin-top: 25px;
      cursor: pointer;
      font-weight: bold;
      transition: background-color 0.3s;
    }

    input[type="submit"]:hover {
      background-color: #01579b;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <h2>Invalid Data!!!</h2>
    <h3>Dear Customer, please enter your details to login.</h3>
    <form action="Login" onsubmit="return validateLoginForm()">
      <label>CustId</label>
      <input type="text" name="custid" id="custid" required />

      <label>Password</label>
      <input type="password" name="pwd" id="pwd" required />

      <input type="submit" value="Login" />
    </form>
  </div>

  <script>
    function validateLoginForm() {
      const custid = document.getElementById("custid").value.trim();
      const pwd = document.getElementById("pwd").value;

      if (custid === "" || pwd === "") {
        alert("Please fill in all fields.");
        return false;
      }

      return true;
    }

    console.log("Login page loaded ");
  </script>
</body>
</html>

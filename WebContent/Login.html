<!DOCTYPE html>
<html>
<head>
  <meta charset="ISO-8859-1">
  <title>Login | LARA Bank</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to right, #e1f5fe, #b3e5fc);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      background-color: white;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
      text-align: center;
      max-width: 400px;
      animation: fadeIn 0.5s ease-in-out;
    }

    h2 {
      color: #0277bd;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
      color: #333;
      text-align: left;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    input[type="submit"] {
      margin-top: 25px;
      padding: 10px 25px;
      background-color: #0288d1;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 16px;
      transition: background-color 0.3s;
    }

    input[type="submit"]:hover {
      background-color: #01579b;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Dear Customer, please enter your details to login.</h2>
    <form action="Login">
      <label>CustId</label>
      <input type="text" name="custid" required />

      <label>Password</label>
      <input type="password" name="pwd" required />

      <input type="submit" value="Login" />
    </form>
  </div>

  <script>
    console.log("Login page loaded.");
  </script>
</body>
</html>
